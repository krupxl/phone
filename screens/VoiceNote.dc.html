<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 24px 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 14px" aria-hidden="true">
        <div style="width: 5px; height: 5px; background: #efeee9"></div>
        <div style="width: 5px; height: 8px; background: #efeee9"></div>
        <div style="width: 5px; height: 11px; background: #efeee9"></div>
        <div style="width: 5px; height: 14px; background: #3a3a3a"></div>
      </div>
      <span>Open</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; color: #ef8a77"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ef8a77" aria-hidden="true"></span><span>Mic on</span></div>
    <span>86%</span>
  </div>
  <div style="margin-top: 40px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: #ef8a77">
    <span style="width: 18px; height: 18px; border-radius: 50%; background: #ef8a77" aria-hidden="true"></span>
    <span>Recording</span>
  </div>
  <div style="margin-top: 14px; font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -1px">0:42</div>
  <div style="margin-top: 40px; height: 90px; display: flex; align-items: center; gap: 5px" aria-hidden="true">
    <div style="width: 6px; height: 20px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 46px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 70px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 38px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 58px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 84px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 50px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 28px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 62px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 40px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 74px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 34px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 54px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 22px; background: #efeee9; border-radius: 3px"></div>
    <div style="width: 6px; height: 44px; background: #5a5a56; border-radius: 3px"></div>
    <div style="width: 6px; height: 16px; background: #5a5a56; border-radius: 3px"></div>
    <div style="width: 6px; height: 10px; background: #5a5a56; border-radius: 3px"></div>
  </div>
  <div style="margin-top: 26px; font-size: 22px; color: #9a998f; line-height: 1.4">Saved to Voice notes when you let go. Hold the key while you talk.</div>
  <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 15px; color: #9a998f">
    <span>Release Wave key: save</span>
    <span>Back: discard</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":612}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
