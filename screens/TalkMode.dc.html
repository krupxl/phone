<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talk mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 24px 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 14px" aria-hidden="true">
        <div style="width: 5px; height: 5px; background: #efeee9"></div>
        <div style="width: 5px; height: 8px; background: #efeee9"></div>
        <div style="width: 5px; height: 11px; background: #efeee9"></div>
        <div style="width: 5px; height: 14px; background: #3a3a3a"></div>
      </div>
      <span style="color: #35b3a2">Talk: no internet</span>
    </div>
    <span>86%</span>
  </div>
  <div style="margin-top: 34px; font-size: 108px; font-weight: 600; line-height: 1; letter-spacing: -2px">10:08</div>
  <div style="margin-top: 10px; font-size: 22px; color: #9a998f">Saturday 21 November</div>
  <div style="margin-top: 20px; padding: 10px 14px; border: 1.5px solid #35b3a2; border-radius: 10px; font-size: 18px; line-height: 1.35">Calls and texts only. WhatsApp and Signal messages wait until you slide back to Open.</div>
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 2px; font-size: 27px; font-weight: 500">
    <div style="padding: 8px 14px; background: #efeee9; color: #050506; border-radius: 10px">Phone</div>
    <div style="padding: 8px 14px; display: flex; justify-content: space-between; align-items: baseline"><span>Messages</span><span style="font-size: 17px; color: #9a998f">texts only</span></div>
    <div style="padding: 8px 14px; display: flex; justify-content: space-between; align-items: baseline; color: #8f8e89"><span>WhatsApp</span><span style="font-size: 17px">waiting</span></div>
    <div style="padding: 8px 14px">Camera</div>
  </div>
  <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 15px; color: #9a998f">
    <span>Type to search</span>
    <span>Menu: options</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":612}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
