<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On a call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 16px 12px">
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; padding: 0 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 14px" aria-hidden="true">
        <div style="width: 5px; height: 5px; background: #efeee9"></div>
        <div style="width: 5px; height: 8px; background: #efeee9"></div>
        <div style="width: 5px; height: 11px; background: #efeee9"></div>
        <div style="width: 5px; height: 14px; background: #3a3a3a"></div>
      </div>
      <span>Open</span>
    </div>
    <span>86%</span>
  </div>
  <div style="padding: 0 8px; display: flex; flex-direction: column">
    <div style="margin-top: 30px; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; color: #7cc7a4">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #7cc7a4" aria-hidden="true"></span>
      <span>On call</span>
    </div>
    <div style="margin-top: 8px; font-size: 56px; font-weight: 600; line-height: 1.05">Maya Patel</div>
    <div style="margin-top: 10px; font-size: 32px; font-weight: 500; color: #9a998f">03:12</div>
    <div style="margin-top: 22px; display: flex; gap: 10px; font-size: 17px; font-weight: 500">
      <span style="padding: 5px 10px; border: 1.5px solid #efeee9; border-radius: 999px">Speaker on</span>
    </div>
    <div style="margin-top: 18px; font-size: 17px; color: #9a998f">Close the lid to end the call</div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 16px; font-weight: 500">
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#9a998f" stroke-width="1.6" fill="none"></circle><circle cx="8" cy="8" r="2.2" stroke="#9a998f" stroke-width="1.6" fill="none"></circle></svg><span>Add call</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8 C3 3,4.5 3,6 8 S9 13,10.5 8 S13.5 3,14.5 8" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Note</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h10M3 8h10M5 11h6" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Keypad</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 14.5,8 8,14.5 1.5,8" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linejoin="round"></polygon></svg><span>Record</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 16px; font-weight: 500">
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Mute</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Hold</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #efeee9; color: #050506; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75" stroke="#3c3b36" stroke-width="1.6" fill="none" stroke-linejoin="round"></polygon></svg><span>Speaker</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #ef8a77; color: #1a0604; border-radius: 8px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 9.53,5.9 14.18,5.99 10.47,8.8 11.82,13.26 8,10.6 4.18,13.26 5.53,8.8 1.82,5.99 6.47,5.9" stroke="#1a0604" stroke-width="1.4" fill="none" stroke-linejoin="round"></polygon></svg><span>End</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":612}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
