<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup 2: Joystick, Back, Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 28px 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 16px; font-weight: 500; color: #9a998f">Setup · 2 of 7</span>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #efeee9"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #efeee9"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
    </div>
  </div>
  <div style="margin-top: 34px; font-size: 44px; font-weight: 600; line-height: 1.1">Moving around</div>
  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 14px; font-size: 21px; line-height: 1.35">
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="min-width: 110px; font-weight: 600">Joystick</span><span style="color: #c9c8c2">Move to choose, click to select</span></div>
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="min-width: 110px; font-weight: 600">◁ Back</span><span style="color: #c9c8c2">One step back. Hold it to go home</span></div>
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="min-width: 110px; font-weight: 600">□ Menu</span><span style="color: #c9c8c2">Options for whatever is highlighted</span></div>
  </div>
  <div style="margin-top: 26px; font-size: 15px; font-weight: 500; color: #9a998f; letter-spacing: 1px">TRY IT: MOVE DOWN TO THE LAST ONE AND CLICK</div>
  <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 2px; font-size: 24px; font-weight: 500">
    <div style="padding: 8px 14px">One</div>
    <div style="padding: 8px 14px; background: #efeee9; color: #050506; border-radius: 10px">Two</div>
    <div style="padding: 8px 14px">Three</div>
  </div>
  <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 15px; color: #9a998f">
    <span>Back: previous</span>
    <span>Click Three: next</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":612}}'>

  renderVals() { return {}; }

</html>
