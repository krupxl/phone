<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 16px 12px">
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; padding: 0 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 14px" aria-hidden="true">
        <div style="width: 5px; height: 5px; background: #efeee9"></div>
        <div style="width: 5px; height: 8px; background: #efeee9"></div>
        <div style="width: 5px; height: 11px; background: #efeee9"></div>
        <div style="width: 5px; height: 14px; background: #3a3a3a"></div>
      </div>
      <span>Open</span>
    </div>
    <span>10:38</span>
    <span>86%</span>
  </div>
  <div style="padding: 0 8px">
    <div style="margin-top: 20px; font-size: 34px; font-weight: 600">Voice notes</div>
    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 2px">
      <div style="padding: 9px 12px; background: #efeee9; color: #050506; border-radius: 10px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 23px; font-weight: 600">Idea for the hinge</span><span style="font-size: 17px; color: #3c3b36">0:42 · 10:31</span></div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-size: 16px; font-weight: 600">Playing</span>
          <div style="flex-grow: 1; height: 4px; background: #c9c8c2; border-radius: 2px; position: relative"><div style="width: 45%; height: 4px; background: #050506; border-radius: 2px"></div></div>
          <span style="font-size: 16px; color: #3c3b36">0:19</span>
        </div>
      </div>
      <div style="padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 23px; font-weight: 500">Recording 12</span><span style="font-size: 17px; color: #9a998f">1:07 · Yesterday</span></div>
      <div style="padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 23px; font-weight: 500">Song sketch</span><span style="font-size: 17px; color: #9a998f">3:20 · Thursday</span></div>
      <div style="padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 23px; font-weight: 500">Meeting with Lea</span><span style="font-size: 17px; color: #9a998f">24:51 · Tuesday</span></div>
    </div>
    <div style="margin-top: 10px; font-size: 17px; color: #9a998f">Hold the Wave key anywhere to record a new one.</div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 16px; font-weight: 500">
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#9a998f" stroke-width="1.6" fill="none"></circle><circle cx="8" cy="8" r="2.2" stroke="#9a998f" stroke-width="1.6" fill="none"></circle></svg><span>Back 10 s</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8 C3 3,4.5 3,6 8 S9 13,10.5 8 S13.5 3,14.5 8" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Transcribe</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h10M3 8h10M5 11h6" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>To note</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 14.5,8 8,14.5 1.5,8" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linejoin="round"></polygon></svg><span>Forward 10 s</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 16px; font-weight: 500">
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #efeee9; color: #050506; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="#3c3b36" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Pause</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg><span>Delete</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75" stroke="#9a998f" stroke-width="1.6" fill="none" stroke-linejoin="round"></polygon></svg><span>Rename</span></div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 8px 9px; background: #17171a; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 9.53,5.9 14.18,5.99 10.47,8.8 11.82,13.26 8,10.6 4.18,13.26 5.53,8.8 1.82,5.99 6.47,5.9" stroke="#9a998f" stroke-width="1.4" fill="none" stroke-linejoin="round"></polygon></svg><span>Send</span></div>
    </div>
  </div>
</div>
</x-dc>
