<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-time setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efeee9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 540px; height: 612px; box-sizing: border-box; background: #050506; color: #efeee9; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 28px 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 16px; font-weight: 500; color: #9a998f">Setup · 3 of 7</span>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #efeee9"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #efeee9"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #efeee9"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #3a3a3a"></div>
    </div>
  </div>
  <div style="margin-top: 36px; font-size: 44px; font-weight: 600; line-height: 1.1">The eight shape keys</div>
  <div style="margin-top: 14px; font-size: 22px; line-height: 1.45; color: #c9c8c2">Just below the screen. In any app, the strip at the bottom of the screen shows what each one does there.</div>
  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 21px">
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="min-width: 74px; font-weight: 600">Press</span><span style="color: #c9c8c2">the action on the strip</span></div>
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="min-width: 74px; font-weight: 600">Hold</span><span style="color: #c9c8c2">the key's own job, from anywhere: hold the lens for the camera</span></div>
  </div>
  <div style="margin-top: 24px; padding: 14px; border: 2px solid #efeee9; border-radius: 12px; font-size: 22px; font-weight: 500; display: flex; justify-content: space-between; align-items: center">
    <span>Try it: hold the lens key</span>
    <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#efeee9" stroke-width="1.6" fill="none"></circle><circle cx="8" cy="8" r="2.2" stroke="#efeee9" stroke-width="1.6" fill="none"></circle></svg>
  </div>
  <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 15px; color: #9a998f">
    <span>Back: previous</span>
    <span>Click: next</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":612}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
